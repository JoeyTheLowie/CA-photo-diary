name: Process photos and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Process new photos and notes
        run: node scripts/process.mjs

      - name: Save the results to the repository
        run: |
          git config user.name "diary-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in img data inbox trash; do
            # only folders that exist or are tracked (an empty trash folder used to fail the whole run)
            if [ -e "$d" ] || [ -n "$(git ls-files -- "$d")" ]; then git add -A -- "$d"; fi
          done
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Process photos"
            for i in 1 2 3 4; do
              git push && break
              git pull --rebase
            done
          fi

      - name: Collect the website files
        run: |
          mkdir -p _site
          cp -r index.html assets data img post .nojekyll _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
